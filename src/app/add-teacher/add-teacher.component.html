<div class="page-container">
  <div class="page-header">
    <div class="header-content">
      <div class="header-icon">
        <i class="bi bi-person-badge"></i>
      </div>
      <div>
        <h1 class="page-title">{{ isEditMode ? 'ویرایش استاد' : 'افزودن استاد جدید' }}</h1>
        <p class="page-subtitle">{{ isEditMode ? 'اطلاعات استاد را به‌روزرسانی کنید' : 'جزئیات را پر کنید تا یک استاد جدید اضافه شود' }}</p>
      </div>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="form-card">
      <form [formGroup]="teacherForm" (ngSubmit)="onSubmit()">
        <div class="form-grid">
          <div class="form-group full-width">
            <label for="name" class="form-label">
              <i class="bi bi-person"></i> نام استاد <span class="required">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              [class.is-invalid]="isFieldInvalid('name')"
              id="name"
              formControlName="name"
              placeholder="نام کامل استاد را وارد کنید"
            />
            <div class="invalid-feedback" *ngIf="isFieldInvalid('name')">
              {{ getFieldError('name') }}
            </div>
          </div>

          <div class="form-group full-width">
            <label for="phone" class="form-label">
              <i class="bi bi-telephone"></i> شماره تماس <span class="required">*</span>
            </label>
            <input
              type="tel"
              class="form-control"
              [class.is-invalid]="isFieldInvalid('phone')"
              id="phone"
              formControlName="phone"
              placeholder="شماره تماس را وارد کنید (9 یا 10 رقم)"
            />
            <div class="invalid-feedback" *ngIf="isFieldInvalid('phone')">
              {{ getFieldError('phone') }}
            </div>
          </div>

          <div class="form-group full-width">
            <label class="form-label">
              <i class="bi bi-book"></i> مضامین <span class="required">*</span>
            </label>
            <div class="subjects-container" [class.is-invalid]="isFieldInvalid('subjects')">
              <div class="subjects-grid" *ngIf="subjects.length > 0">
                <label 
                  *ngFor="let subject of subjects" 
                  class="subject-checkbox"
                  [class.selected]="isSubjectSelected(subject.id)"
                >
                  <input
                    type="checkbox"
                    [checked]="isSubjectSelected(subject.id)"
                    (change)="toggleSubject(subject.id)"
                  />
                  <span class="subject-label">{{ subject.name }}</span>
                </label>
              </div>
              <div *ngIf="subjects.length === 0" class="loading-subjects">
                .مضمونی یافت نشد
              </div>
            </div>
            <div class="invalid-feedback" *ngIf="isFieldInvalid('subjects')">
              {{ getFieldError('subjects') }}
            </div>
            <small class="form-text">حداقل یک مضمون انتخاب کنید</small>
          </div>
        </div>

        <div class="form-actions">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="onCancel()"
          >
            لغو
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="teacherForm.invalid"
          >
            {{ isEditMode ? 'به‌روزرسانی استاد' : 'افزودن استاد' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
